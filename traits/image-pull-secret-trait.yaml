# image-pull-secret ClusterTraits — inject `imagePullSecrets` into the rendered pod spec so
# components can pull PRIVATE-registry images (OpenChoreo has no native support — verified absent at
# upstream HEAD 296c0001, 2026-07-20). Same `spec.patches` JSONPatch mechanism as the volume-mount
# traits (array path ending in `-` self-vivifies on Deployments that render no imagePullSecrets).
#
# Two single-purpose variants (same model as the volume traits): scheduled-task / manual-task render
# CronJobs, not Deployments, so they need a different patch path.
#
# The traits only NAME the secret — something must put a kubernetes.io/dockerconfigjson Secret of
# that name into every cell namespace. The companion `registry-pull/` dir ships a
# ClusterExternalSecret that does this from OpenBao (manual step — needs a registry credential
# seeded first; see registry-pull/README.md). E2E-validated on the migration POC 2026-07-21
# (private GHCR image → 1/1 Running).
#
# allowedTraits wiring (setup.sh): `image-pull-secret` → service / web-application / worker;
# `image-pull-secret-cronjob` → scheduled-task (patched) + manual-task (baked into the CT yaml).
---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: image-pull-secret
  annotations:
    openchoreo.dev/description: "Adds an imagePullSecret to the component Deployment's pod spec for private-registry pulls (no upstream CT change)."
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        secretName:
          type: string
          default: ghcr-pull-secret
          description: "Name of the kubernetes.io/dockerconfigjson Secret in the cell namespace (see registry-pull/ for delivery)."
  patches:
    - target:
        group: apps
        version: v1
        kind: Deployment
      operations:
        - op: add
          path: /spec/template/spec/imagePullSecrets/-
          value:
            name: ${parameters.secretName}
---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: image-pull-secret-cronjob
  annotations:
    openchoreo.dev/description: "Adds an imagePullSecret to the component CronJob's pod spec (scheduled-task / manual-task) for private-registry pulls."
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        secretName:
          type: string
          default: ghcr-pull-secret
          description: "Name of the kubernetes.io/dockerconfigjson Secret in the cell namespace (see registry-pull/ for delivery)."
  patches:
    - target:
        group: batch
        version: v1
        kind: CronJob
      operations:
        - op: add
          path: /spec/jobTemplate/spec/template/spec/imagePullSecrets/-
          value:
            name: ${parameters.secretName}
