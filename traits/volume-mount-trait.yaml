# volume-mount ClusterTraits — give ANY Deployment-backed component (service / web-application /
# worker) volumes + file mounts WITHOUT any upstream ComponentType change. Closes coverage-review
# AX2 ("storage volumes / file mounts") and, incidentally, migration blocker B1 (G7) for orgs that
# use mounts. The aiteam pilot is 100% EmptyDir (100 rows) + config file mounts (files[]); PVC is the
# only durable type (Q3) and is shipped here as a proven extension point.
#
# ================= THE KEY UNKNOWN, RESOLVED =================
# Every trait built so far (jwt-auth / rate-limit / cors / mediation / autoscaler) only EMITS SIBLING
# resources via `spec.creates` (TrafficPolicy, HPA). None patch the Deployment. The question was: can a
# ClusterTrait MUTATE the rendered workload's Deployment pod spec (inject spec.template.spec.volumes[]
# and the container's volumeMounts[])?
#
# ANSWER: YES. ClusterTrait `spec.patches` applies RFC-6902 JSONPatch `operations` (add/replace/remove)
# to a `target` resource generated by the ComponentType, with JSONPath array-filter paths. Verified in
# the OC source (internal/patch + internal/pipeline/component/trait/processor.go):
#   - ProcessTraits runs `creates` first, THEN `patches` — so patches land on the fully-rendered
#     Deployment (after the CT's CEL evaluates), exactly what we need.
#   - `ensureParentExists` (internal/patch/rfc6902.go) AUTO-CREATES missing parent arrays for `add`
#     ops whose path ends in `-`. So on a component that has NO other volumes (aiteam's exact case —
#     the live service CT prunes the empty `volumes`/`volumeMounts` fields), `add /spec/template/spec/
#     volumes/-` self-vivifies `volumes: []` then appends, and the array-filter
#     `containers/[?(@.name=='main')]/volumeMounts/-` resolves the matched container then auto-creates
#     its `volumeMounts: []`. A filter matching NO container errors (surfaces a misconfig) — good.
#   - The container the built-in Deployment CTs render is named `main` (verified on the live `service`
#     CCT: `containers[].name: main`). That is the default `containerName` below and the join the
#     mount patch hinges on — do not change CT container naming without updating this.
# Upstream even SHIPS this pattern (namespaced Traits `emptydir-volume` + `persistent-volume` in
# openchoreo/internal/pipeline/component/testdata + sample-gitops) — we mirror it as reusable
# ClusterTraits and add the missing `file-mount` (ConfigMap/Secret materialization).
#
# ================= DESIGN =================
# Three SINGLE-PURPOSE traits (not one type-discriminated mega-trait): patches cannot be gated by
# `includeWhen` (only `creates` can), so a unified trait would need one giant CEL ternary picking the
# volume source. Three focused traits give the migration tool a clean 1:1 mapping:
#   V2 app_volumes.type EmptyDir  -> attach `emptydir-volume`
#   V2 config files[]             -> attach `file-mount`
#   V2 app_volumes.type PVC       -> attach `persistent-volume`   (HostPath/NFS: out of scope, rare)
# One volume == one trait instance (matches autoscaler/rate-limit's per-instance model). Multiple
# volumes == multiple attachments with distinct instanceNames.
#
# PREREQ / Helm-fragility (F131 / A7 class): each of these three trait NAMES must be listed in each
# target CT's `spec.allowedTraits` (patched live onto the `service` CCT — Helm-fragile, re-apply after
# any control-plane helm upgrade; the built-in CTs are not Helm-managed on the POC per the 1.1.1
# upgrade finding, but treat as fragile). No extra cluster-agent RBAC is needed: volumes/volumeMounts
# are core Deployment fields the agent already writes, and ConfigMaps are core resources (unlike the
# kgateway policy CRDs behind A7). PVC provisioning depends on a working CSI — see the persistent-
# volume note re: F139 on the POC.
---
# --- Trait 1: emptydir-volume -------------------------------------------------------------------
# Ephemeral scratch volume shared by the pod's containers, gone when the pod dies. 100% of aiteam's
# app_volumes. No sibling resource — pure pod-spec patch.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: emptydir-volume
  annotations:
    openchoreo.dev/description: "EmptyDir scratch volume + mount injected into the component's Deployment pod spec (no upstream CT change). Closes coverage-review AX2 (emptyDir)."
spec:
  parameters:
    openAPIV3Schema:
      type: object
      required: [volumeName, mountPath]
      properties:
        volumeName:
          type: string
          description: "Pod-unique volume name (also the k8s volume name). One per trait instance."
        mountPath:
          type: string
          description: "Absolute path the volume is mounted at inside the container, e.g. /tmp/cache."
        containerName:
          type: string
          default: main
          description: "Container to mount into. Built-in OC Deployment CTs render exactly one container named 'main'."
        readOnly:
          type: boolean
          default: false
          description: "Mount the emptyDir read-only (rarely useful for scratch space; default false)."
        subPath:
          type: string
          default: ""
          description: "Optional subPath within the volume to mount (default '' = mount the whole volume at mountPath)."
  # sizeLimit + medium are per-environment (a bigger scratch dir in prod, tmpfs only where RAM allows).
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        sizeLimit:
          type: string
          default: ""
          description: "Max size, e.g. 512Mi. '' (default) = no explicit limit (bounded by node ephemeral storage)."
        medium:
          type: string
          default: ""
          description: "'' = node disk; 'Memory' = tmpfs (counts against the container memory limit)."
  patches:
    # 1) Append the emptyDir volume to the pod spec. `volumes` self-vivifies if absent (path ends /-).
    - target:
        group: apps
        version: v1
        kind: Deployment
      operations:
        - op: add
          path: /spec/template/spec/volumes/-
          value:
            name: ${parameters.volumeName}
            # sizeLimit/medium omitted individually when empty -> a bare emptyDir {} when neither is set.
            emptyDir: '${environmentConfigs.sizeLimit != "" || environmentConfigs.medium != "" ? {"sizeLimit": environmentConfigs.sizeLimit != "" ? environmentConfigs.sizeLimit : oc_omit(), "medium": environmentConfigs.medium != "" ? environmentConfigs.medium : oc_omit()} : {}}'
    # 2) Append the volumeMount to the 'main' container (its volumeMounts self-vivifies if absent).
    - target:
        group: apps
        version: v1
        kind: Deployment
      operations:
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/volumeMounts/-
          value: '${parameters.subPath != "" ? {"name": parameters.volumeName, "mountPath": parameters.mountPath, "readOnly": parameters.readOnly, "subPath": parameters.subPath} : {"name": parameters.volumeName, "mountPath": parameters.mountPath, "readOnly": parameters.readOnly}}'
---
# --- Trait 2: file-mount ------------------------------------------------------------------------
# Materialize provided file CONTENT into a ConfigMap (non-sensitive) and mount it as a single file, OR
# mount an already-provisioned k8s Secret (sensitive path — content flows through OpenBao/SecretReference
# per the migration convention, NOT this trait). Covers V2 config `files[]`
# ({mount_path, templated_file_content, secret_name}); aiteam's file content is recoverable in-DB
# (SEMANTICS Q2) so it lands in a ConfigMap here.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: file-mount
  annotations:
    openchoreo.dev/description: "Mount a config file into the component's Deployment: materialize content into a ConfigMap (or mount an existing Secret) + inject the volume/volumeMount. Closes coverage-review AX2 (file mounts)."
spec:
  parameters:
    openAPIV3Schema:
      type: object
      required: [volumeName, mountPath, fileName]
      properties:
        volumeName:
          type: string
          description: "Pod-unique volume name."
        mountPath:
          type: string
          description: "Absolute FILE path where the content is mounted, e.g. /etc/app/config.yaml (mounted via subPath so it does not clobber the directory)."
        fileName:
          type: string
          description: "The file's key inside the volume — the ConfigMap/Secret data key AND the mount subPath. Usually basename(mountPath)."
        containerName:
          type: string
          default: main
          description: "Container to mount into (built-in Deployment CTs = 'main')."
        readOnly:
          type: boolean
          default: true
          description: "Config files are read-only by default."
        sensitive:
          type: boolean
          default: false
          description: "false = materialize content into a ConfigMap (created by this trait). true = mount an EXISTING k8s Secret named `secretName` (provision it via the OpenBao/SecretReference path first — this trait does NOT create secret content)."
        secretName:
          type: string
          default: ""
          description: "When sensitive=true, the name of the pre-provisioned k8s Secret to mount. Ignored when sensitive=false."
  # File content is per-environment (V2 templated_file_content is templated per env). Only used when
  # sensitive=false; supply/override via ReleaseBinding.spec.componentTypeEnvironmentConfigs? No —
  # traitEnvironmentConfigs[instanceName].content.
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        content:
          type: string
          default: ""
          description: "Verbatim file content placed in the ConfigMap under `fileName`. Per-environment. Ignored when sensitive=true."
  creates:
    # ConfigMap holding the file content — ONLY for the non-sensitive path.
    - includeWhen: ${!parameters.sensitive}
      targetPlane: dataplane
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${metadata.name}-${trait.instanceName}
          namespace: ${metadata.namespace}
          labels:
            openchoreo.dev/component-uid: ${metadata.componentUID}
            openchoreo.dev/environment-uid: ${metadata.environmentUID}
            openchoreo.dev/project-uid: ${metadata.projectUID}
        # Dynamic map key: data = { <fileName>: <content> }.
        data: '${{parameters.fileName: environmentConfigs.content}}'
  patches:
    # 1) Append the volume. Source is chosen by CEL: ConfigMap (this trait's CM) or an existing Secret.
    - target:
        group: apps
        version: v1
        kind: Deployment
      operations:
        - op: add
          path: /spec/template/spec/volumes/-
          value: '${parameters.sensitive ? {"name": parameters.volumeName, "secret": {"secretName": parameters.secretName}} : {"name": parameters.volumeName, "configMap": {"name": metadata.name + "-" + trait.instanceName}}}'
    # 2) Append the volumeMount, using subPath=fileName so ONLY the file appears at mountPath.
    - target:
        group: apps
        version: v1
        kind: Deployment
      operations:
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/volumeMounts/-
          value:
            name: ${parameters.volumeName}
            mountPath: ${parameters.mountPath}
            subPath: ${parameters.fileName}
            readOnly: ${parameters.readOnly}
---
# --- Trait 3: persistent-volume -----------------------------------------------------------------
# Durable storage that survives pod restarts (the ONLY durable V2 volume type, Q3). Creates a PVC and
# mounts it. aiteam has ZERO PVCs, so this is shipped as a PROVEN extension point (mirrors the upstream
# `persistent-volume` sample Trait) but NOT provisioned on the POC — the POC's only StorageClass is
# `harvester`, whose CSI is blocked by F139 (can't provision/delete volumes; quota trap). Validate on a
# cluster with a working CSI (e.g. local-path) before relying on it.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: persistent-volume
  annotations:
    openchoreo.dev/description: "PersistentVolumeClaim + durable volume/mount injected into the component's Deployment (no upstream CT change). Closes coverage-review AX2 (PVC). Requires a working CSI (F139 on the POC)."
spec:
  parameters:
    openAPIV3Schema:
      type: object
      required: [volumeName, mountPath]
      properties:
        volumeName:
          type: string
          description: "Pod-unique volume name."
        mountPath:
          type: string
          description: "Absolute path the durable volume is mounted at."
        containerName:
          type: string
          default: main
          description: "Container to mount into (built-in Deployment CTs = 'main')."
        readOnly:
          type: boolean
          default: false
        subPath:
          type: string
          default: ""
          description: "Optional subPath within the PVC to mount (default '' = whole volume)."
  # Size / class / access mode are per-environment (bigger, replicated storage in prod).
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        size:
          type: string
          default: "1Gi"
          description: "Requested storage, e.g. 5Gi."
        storageClass:
          type: string
          default: ""
          description: "StorageClass name. '' (default) omits the field -> the cluster default StorageClass is used."
        accessMode:
          type: string
          default: ReadWriteOnce
          description: "PVC access mode: ReadWriteOnce | ReadOnlyMany | ReadWriteMany (depends on the CSI)."
  creates:
    - targetPlane: dataplane
      template:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${metadata.name}-${trait.instanceName}
          namespace: ${metadata.namespace}
          labels:
            openchoreo.dev/component-uid: ${metadata.componentUID}
            openchoreo.dev/environment-uid: ${metadata.environmentUID}
            openchoreo.dev/project-uid: ${metadata.projectUID}
        spec:
          accessModes:
            - ${environmentConfigs.accessMode}
          resources:
            requests:
              storage: ${environmentConfigs.size}
          # storageClassName omitted entirely when blank -> cluster default StorageClass applies.
          storageClassName: '${environmentConfigs.storageClass != "" ? environmentConfigs.storageClass : oc_omit()}'
  patches:
    - target:
        group: apps
        version: v1
        kind: Deployment
      operations:
        - op: add
          path: /spec/template/spec/volumes/-
          value:
            name: ${parameters.volumeName}
            persistentVolumeClaim:
              claimName: ${metadata.name}-${trait.instanceName}
    - target:
        group: apps
        version: v1
        kind: Deployment
      operations:
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/volumeMounts/-
          value: '${parameters.subPath != "" ? {"name": parameters.volumeName, "mountPath": parameters.mountPath, "readOnly": parameters.readOnly, "subPath": parameters.subPath} : {"name": parameters.volumeName, "mountPath": parameters.mountPath, "readOnly": parameters.readOnly}}'
