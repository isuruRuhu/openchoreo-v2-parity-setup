# APIGateway CR — apply to ns openchoreo-data-plane after installing the gateway-operator.
# Instructs the WSO2 gateway-operator to deploy the gateway controller + runtime, referencing the
# api-platform-operator-gateway-values ConfigMap (gateway-configuration.yaml). Bundled SQLite storage.
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: APIGateway
metadata:
  name: api-platform-default
  namespace: openchoreo-data-plane
spec:
  apiSelector:
    scope: Cluster
  infrastructure:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
  storage:
    type: sqlite
  configRef:
    name: api-platform-operator-gateway-values
