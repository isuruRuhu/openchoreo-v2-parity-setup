# Delivers a private-registry dockerconfigjson Secret into EVERY OpenChoreo cell namespace —
# current and future — via ESO ClusterExternalSecret. NOT applied by setup.sh: it needs a registry
# credential seeded into OpenBao first (see README.md in this dir).
#
# Selector: `openchoreo.dev/created-by=renderedrelease-controller` labels ONLY cell namespaces —
# new namespaces get the Secret automatically on creation.
#
# Defaults are GHCR + OpenBao path `secret/aiteam/ghcr-pull` (data key `value` = the full
# .dockerconfigjson JSON string) via ClusterSecretStore `default` — adjust `remoteRef.key` and the
# secret name for your registry. Pods reference it via the `image-pull-secret`(-cronjob) traits.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: ghcr-pull-secret
spec:
  externalSecretName: ghcr-pull-secret
  namespaceSelectors:
    - matchLabels:
        openchoreo.dev/created-by: renderedrelease-controller
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: default
    target:
      name: ghcr-pull-secret
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: "{{ .dockerconfigjson }}"
    data:
      - secretKey: dockerconfigjson
        remoteRef:
          key: aiteam/ghcr-pull
          property: value
